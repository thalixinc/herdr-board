[package]
name = "herdr-board"
version = "0.1.0"
edition = "2021"
description = "Greenfield herdr kanban plugin: GitHub-issue board + card-to-factory trigger"
license = "UNLICENSED"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
ureq = "2"
uuid = { version = "1", features = ["v4"] }
